<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Software Disciples: learn graph data structures, BFS and DFS, and transitive closure for COS212, with quizzes, coding questions and rewards." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/disciples-mark.png" />
    <title>Software Disciples · COS212 Graphs</title>
  </head>
  <body style="background:#04060b">
    <script>
      // Apply the saved theme and text size before React loads, so nothing flashes or jumps.
      try {
        var st = JSON.parse(localStorage.getItem('cos212-graphs:settings') || '{}');
        var sc = typeof st.textScale === 'number' ? st.textScale : (st.largeText ? 1.2 : 1);
        document.documentElement.style.fontSize = (16 * Math.min(1.6, Math.max(0.85, sc))) + 'px';
        var t = st.theme || 'night';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night';
        if (t === 'day') { document.documentElement.dataset.theme = 'day'; document.body.style.background = '#f3f7ff'; }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
